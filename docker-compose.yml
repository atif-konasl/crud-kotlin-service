services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crud-kotlin-service
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_APPLICATION_NAME=crud-kotlin-service
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/crud_db
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=app_password
      - EXTERNAL_CLIENT_BASE_URL=http://mock-external-api:8080
      - EXTERNAL_CLIENT_AUTH_TOKEN=test-bearer-token-12345
      - JWT_JWK_SET_URI=http://mock-external-api:8080/oauth2/jwks
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      mock-external-api:
        condition: service_started
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: crud_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d crud_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  mock-external-api:
    image: wiremock/wiremock:3.9.1
    container_name: mock-external-api
    ports:
      - "8081:8080"
    volumes:
      - .dev/wiremock:/home/wiremock
    networks:
      - app-network

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: jaeger-tracing
    ports:
      - "16686:16686" # Web UI
      - "4318:4318"   # OpenTelemetry HTTP collector
      - "4317:4317"   # OpenTelemetry gRPC collector
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
